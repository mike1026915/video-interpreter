<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>影片口譯</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="row">
      <label>原文語言
        <select id="srcLang">
          <option value="auto">自動偵測</option>
          <option value="en">英文</option>
          <option value="ja" selected>日文</option>
          <option value="ko">韓文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
          <option value="es">西班牙文</option>
          <option value="zh">中文（只轉寫）</option>
        </select>
      </label>
      <label>辨識模型
        <select id="model">
          <option value="onnx-community/whisper-base">Whisper base（快，約 150MB）</option>
          <option value="onnx-community/whisper-small" selected>Whisper small（沒有 GPU 時建議，約 300MB）</option>
          <option value="onnx-community/whisper-large-v3-turbo">Whisper large-v3-turbo（有 GPU 時建議，約 0.8–1.6GB）</option>
          <option value="jiangzhuo9357/Qwen3-ASR-1.7B-ONNX">Qwen3-ASR 1.7B（日文最準，需 WebGPU，約 2–2.7GB）</option>
          <option value="onnx-community/cohere-transcribe-03-2026-ONNX">Cohere Transcribe（實驗，需 WebGPU，約 1.5–2.1GB）</option>
          <option value="custom">自訂（輸入 Hugging Face 模型 ID）…</option>
        </select>
      </label>
      <label>翻譯引擎
        <select id="engine">
          <option value="chrome" selected>Chrome 內建（快，一次一句）</option>
          <option value="hymt">HY-MT1.5 本機模型（參考前文，需 WebGPU，約 1.2–1.4GB）</option>
        </select>
      </label>
      <label>翻譯方式
        <select id="mode">
          <option value="accurate" selected>精準（等句尾整句翻）</option>
          <option value="live">即時（每段立刻翻）</option>
        </select>
      </label>
    </div>
    <div class="row" id="customRow" hidden>
      <label>自訂模型 ID（Transformers.js 能載入的 ONNX 版 Whisper，或 Qwen3-ASR layout v2 的 ONNX）
        <input id="customModel" type="text" spellcheck="false" autocomplete="off"
               placeholder="例如 willopcbeta/whisper-ja-760M-ONNX">
      </label>
    </div>
    <div class="row">
      <button id="startBtn" class="primary">開始口譯</button>
      <button id="stopBtn" disabled>停止</button>
      <span class="spacer"></span>
      <button id="exportBtn" title="下載逐字稿">匯出</button>
      <button id="clearBtn" title="清除內容">清除</button>
    </div>
    <div id="status" class="status">在影片分頁點工具列圖示開啟本側欄，再按「開始口譯」。</div>
    <div id="progress" class="progress" hidden><div></div></div>
    <button id="dlTranslatorBtn" class="notice" hidden></button>
  </header>
  <main id="list"></main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
